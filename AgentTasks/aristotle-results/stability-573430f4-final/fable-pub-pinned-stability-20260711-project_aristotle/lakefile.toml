name = "RequestProject"
defaultTargets = ["context", "PhysicsSM", "Pinned"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

[[lean_lib]]
name = "context"
globs = ["context.+"]

[[lean_lib]]
name = "PhysicsSM"
globs = ["PhysicsSM.+"]

[[lean_lib]]
name = "Pinned"
globs = ["Pinned.+"]
